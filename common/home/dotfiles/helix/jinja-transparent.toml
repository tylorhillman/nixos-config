# Jinja

"ui.background" = {} # transparent mode
"ui.text" = "foreground"
"ui.text.focus" = "highlight"
"ui.background.separator" = { fg = "muted" }
"ui.cursor" = { fg = "background", bg = "accent" }
"ui.cursor.primary" = { fg = "background", bg = "accent" }
"ui.cursor.match" = { fg = "soft_amber", modifiers = ["bold", "underlined"] }
"ui.cursorline" = { bg = "selection" }
"ui.cursorline.primary" = { bg = "selection" }
"ui.cursorline.secondary" = { bg = "selection" }
"ui.selection" = { bg = "muted" }
"ui.selection.primary" = { bg = "muted" }
"ui.highlight" = { fg = "background", bg = "soft_amber" }
"ui.linenr" = { fg = "muted" }
"ui.linenr.selected" = { fg = "highlight" }
"ui.gutter" = {} # transparent mode
"ui.statusline" = { fg = "highlight", bg = "accent_secondary" }
"ui.statusline.inactive" = { fg = "foreground", bg = "night_blue", modifiers = ["dim"] }
"ui.statusline.normal" = { fg = "background", bg = "accent", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "background", bg = "blue", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "background", bg = "soft_amber", modifiers = ["bold"] }
"ui.popup" = {} # transparent mode
"ui.popup.info" = { fg = "foreground" }
"ui.window" = {} # transparent mode 
"ui.help" = { fg = "foreground", bg = "accent" }
"ui.menu" = {} # transparent mode
"ui.menu.selected" = { fg = "background", bg = "accent" }
"ui.menu.scroll" = { fg = "foreground", bg = "night_blue" }
"ui.virtual" = { fg = "muted" }
"ui.virtual.whitespace" = { fg = "muted" }
"ui.virtual.ruler" = { bg = "night_blue" }
"ui.virtual.indent-guide" = { fg = "muted" }
"ui.virtual.inlay-hint" = { fg = "muted" }
"ui.virtual.jump-label" = { fg = "background", bg = "accent", modifiers = ["bold"] }
"ui.bufferline" = { fg = "muted", bg = "surface" }
"ui.bufferline.active" = { fg = "highlight", bg = "night_blue" }

"comment" = { fg = "muted", modifiers = ["italic"] }
"keyword" = "accent"
"keyword.control" = "accent"
"keyword.directive" = "accent_secondary"
"operator" = "accent"
"punctuation" = "muted"
"punctuation.delimiter" = "muted"
"variable" = "foreground"
"variable.builtin" = "accent"
"variable.parameter" = { fg = "highlight", modifiers = ["italic"] }
"variable.other.member" = "dusk_blue"
"function" = "soft_amber"
"function.macro" = "highlight"
"function.builtin" = "soft_amber"
"constructor" = "soft_amber"
"type" = "blue"
"type.builtin" = "blue"
"type.enum.variant" = "teal"
"namespace" = { fg = "blue", modifiers = ["italic"] }
"attribute" = { fg = "soft_amber", modifiers = ["italic"] }
"tag" = "accent"
"special" = "accent"
"label" = "soft_amber"
"string" = "rose"
"string.regexp" = "soft_amber"
"string.special" = "soft_amber"
"constant" = "rose"
"constant.builtin" = "accent"
"constant.numeric" = "soft_amber"
"constant.character.escape" = "teal"

"markup.heading" = { fg = "accent", modifiers = ["bold"] }
"markup.heading.marker" = "muted"
"markup.list" = "accent"
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "blue", modifiers = ["underlined"] }
"markup.link.text" = "soft_amber"
"markup.quote" = "muted"
"markup.raw" = "green"

"diff.plus" = "green"
"diff.minus" = "accent_secondary"
"diff.delta" = "soft_amber"

"diagnostic" = { modifiers = ["underlined"] }
"diagnostic.error" = { underline = { color = "accent_secondary", style = "curl" } }
"diagnostic.warning" = { underline = { color = "soft_amber", style = "curl" } }
"diagnostic.info" = { underline = { color = "blue", style = "curl" } }
"diagnostic.hint" = { underline = { color = "muted", style = "curl" } }
"error" = "accent_secondary"
"warning" = "soft_amber"
"info" = "blue"
"hint" = "muted"

[palette]
background = "#0a0c10"        # Charcoal / Midnight Black (Deep, near-pitch black akin to the night sky over a quiet shrine)
surface = "#14181e"           # Dark Slate / Obsidian (A solid, subtle gray-blue representing stone tiles or weathered wood)
foreground = "#d4cfc6"        # Parchment / Warm Ivory (Soft, unbleached paper white that reduces eye strain like aged scrolls)
muted = "#6a6560"             # Stone Gray / Taupe (A dusty, neutral gray resembling weathered rock paths or ash)
accent = "#e07a3d"            # Fox Orange / Warm Ember (Vibrant, fiery orange like the glowing center of a jinja/shrine lamp)
accent_secondary = "#c45c3a"  # Terracotta / Aged Lacquer (Deep, reddish rust resembling weathered torii gate paint or ancient pottery)
night_blue = "#3d5a6c"        # Twilight Blue / Deep Indigo (Muted, dark evening blue like dusk over the shrine grounds)
dusk_blue = "#4c697b"         # Dusk blue / More Grey (Lighter than night_blue)
foliage = "#4a6b52"           # Forest Green / Moss (Deep, natural evergreen shade representing sanctuary trees and foliage)
soft_amber = "#d4a574"        # Pale Gold / Sandstone (Warm, light tan-gold resembling polished cedar or dim candle glow)
highlight = "#f0e6d0"         # Silk / Off-White (Bright, crisp cream color like fresh cloth or a focused paper lantern beam)
blue = "#6595b2"              # Steel Blue / Clear Stream (Bright, clean sky blue resembling flowing sanctuary waters)
green = "#6b9b77"             # Sage / Jade (Soft, vibrant leaf-green for fresh spring growth and bamboo)
teal = "#7eaba6"              # Seafoam / Oxidized Copper (Calm, minty blue-green like the patina on a weathered bronze roof)
rose = "#c98496"              # Cherry Blossom / Dusty Rose (Soft, muted pink resembling plum blossoms or evening clouds)
selection = "#324858"         # Shadow Blue / Deep Ocean (A rich, visible dark teal-blue used to highlight active text blocks)
